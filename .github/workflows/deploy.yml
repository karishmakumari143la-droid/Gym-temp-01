name: Deploy IronVault Fitness to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Set minimum permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment at a time, skip intermediate runs
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Build Production Assets
        env:
          # Automatically uses base_path detected by actions/configure-pages@v5 (e.g. /Gym-temp-01/)
          # or fallback to /Gym-temp-01/
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || '/Gym-temp-01/' }}
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
