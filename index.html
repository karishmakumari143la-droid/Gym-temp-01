<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IronVault Fitness - Gym Template 01</title>
    <meta name="description" content="Production-ready, premium Indian gym and fitness centre website template with lead generation, WhatsApp enquiry system, and white-label customization." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IronVault Fitness - Gym Template 01" />
    <meta property="og:description" content="Production-ready, premium Indian gym and fitness centre website template with lead generation, WhatsApp enquiry system, and white-label customization." />
    <meta property="og:image" content="%BASE_URL%assets/images/gym/hero-gym.webp" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IronVault Fitness - Gym Template 01" />
    <meta name="twitter:description" content="Production-ready, premium Indian gym and fitness centre website template with lead generation, WhatsApp enquiry system, and white-label customization." />
    <meta name="twitter:image" content="%BASE_URL%assets/images/gym/hero-gym.webp" />

    <!-- Canonical & Robots -->
    <link rel="canonical" href="" id="canonical-meta" />
    <script>
      (function() {
        var c = document.getElementById('canonical-meta');
        if (c) c.setAttribute('href', window.location.origin + window.location.pathname);
      })();
    </script>
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0c0e" />

    <!-- Typography: Barlow Condensed (Athletic Display) + Plus Jakarta Sans (Modern Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD for LocalBusiness / SportsActivityLocation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthClub",
      "name": "IronVault Fitness",
      "alternateName": "IronVault Gym",
      "description": "Premium Indian Gym & Fitness Centre with certified personal training, strength zone, and luxury fitness equipment.",
      "telephone": "+919820012345",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot 42, Waterfield Road",
        "addressLocality": "Bandra West",
        "addressRegion": "Maharashtra",
        "postalCode": "400050",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 19.0596,
        "longitude": 72.8295
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "05:30",
          "closes": "23:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday"],
          "opens": "06:00",
          "closes": "22:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Sunday"],
          "opens": "07:00",
          "closes": "20:00"
        }
      ],
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Commercial Equipment", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Air Conditioning", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Changing Rooms & Lockers", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Dedicated Parking", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Personal Training", "value": true }
      ]
    }
    </script>
  </head>
  <body class="bg-[#0b0c0e] text-[#f4f4f5] antialiased selection:bg-[#f97316] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
